<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とどけ！ もりの おてがみ ― プロトコルのおはなし</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #222; margin: 0; height: 100vh; overflow: hidden;
  }
  #book { position: relative; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  #spine { position: absolute; left: 50%; top: 0; bottom: 0; width: 60px; margin-left: -30px;
    background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.1) 50%, rgba(0,0,0,0));
    z-index: 100; pointer-events: none; }

  .spread { position: absolute; inset: 0; display: none; }
  .spread.active { display: block; animation: fadeIn .5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; display: block; }


  .overlay { position: absolute; inset: 0; display: flex; z-index: 50; pointer-events: none; }
  .col { flex: 1 1 0; min-width: 0; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column;
    font-size: 26px; line-height: 1.75; color: #333; font-weight: 800; text-align: center;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff,
                 2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff, 3px 3px 5px rgba(0,0,0,.2); }
  .col.left { justify-content: flex-start; padding-top: 60px; }
  .col.right { justify-content: flex-start; padding-top: 60px; }

  /* 表紙 */
  .cover { position: absolute; top: 26%; left: 50%; transform: translate(-50%, -50%);
    z-index: 60; text-align: center; width: 80%; }
  .cover h1 { font-size: 72px; color: #5d4037; margin: 0;
    text-shadow: 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff; }
  .cover p { font-size: 24px; font-weight: bold; color: #5d4037; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff; }

  /* 章タイトル */
  /* 情報Ⅰの用語 */
  .term { align-self: center; margin-top: 14px; text-shadow: none; max-width: 100%; box-sizing: border-box; white-space: normal !important;
    background: rgba(255,255,255,.94); border: 3px solid #4a86c2; border-radius: 14px;
    padding: 6px 16px; color: #2c4f78; font-size: 16px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.18); text-align: center; line-height: 1.5; }
  .term b { display: inline-block; background: #4a86c2; color: #fff; border-radius: 8px; padding: 0 8px; margin-right: 8px; font-size: 14px; vertical-align: 2px; }
  .term .w { font-size: 22px; color: #1f3d63; white-space: nowrap; }
  .chapter { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: rgba(93,64,55,.88); color: #fff; padding: 6px 22px; border-radius: 30px;
    font-size: 18px; font-weight: bold; letter-spacing: .1em; white-space: nowrap; }

  /* ならべかえ 体験パネル */
  .sort { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); z-index: 70; width: 680px; box-sizing: border-box;
    background: rgba(255,253,245,.96); border: 4px solid #8d6e63; border-radius: 20px;
    padding: 14px 22px 14px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .sort .lbl { font-size: 15px; color: #6d4c41; font-weight: bold; margin-bottom: 14px; }
  .sort .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sort .pc, .sort .slot { position: relative; height: 62px; border-radius: 10px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; padding: 0 6px;
    font-family: inherit; font-size: 18px; font-weight: 900; color: #3c3478; }
  .sort .pc { border: 3px solid #6e4a36; background: #fffdf6; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
  .sort .pc:hover { background: #fff3c4; }
  .sort .pc.used { opacity: .2; cursor: default; box-shadow: none; }
  .sort .pc.ng { animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .sort .slot { border: 3px dashed #c8b99a; background: #fff; }
  .sort .slot.on { border-style: solid; border-color: #4caf6a; background: #eef8ea; }
  .sort .n { position: absolute; top: -12px; left: -10px; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid #6e4a36; color: #fff; font-size: 15px; line-height: 28px; text-align: center; }
  .sort .arrow { font-size: 14px; color: #8d6e63; font-weight: bold; margin: 12px 0 14px; }
  .sort .msg { font-size: 22px; font-weight: 900; color: #2e7d32; min-height: 1.5em; margin-top: 10px; }
  .sort .hint { font-size: 14px; color: #6d4c41; min-height: 1.4em; }
  .sort .again { margin-top: 6px; padding: 6px 20px; border-radius: 20px; border: none; background: #8d6e63; color: #fff;
    font-family: inherit; font-weight: bold; font-size: 15px; cursor: pointer; }
  .sort .again:hover { background: #6d4c41; }

  /* 解説ページ */
  .notes { position: absolute; inset: 40px 120px 90px 120px; z-index: 70; overflow-y: auto;
    background: rgba(255,255,255,.95); border-radius: 18px; padding: 26px 34px; box-sizing: border-box;
    color: #222; font-size: 16px; line-height: 1.75; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .notes h2 { margin: 0 0 10px; font-size: 22px; color: #5d4037; }
  .notes h3 { margin: 18px 0 4px; font-size: 17px; color: #33691e; }
  .notes table { border-collapse: collapse; width: 100%; margin: 6px 0 4px; font-size: 15px; }
  .notes th, .notes td { border: 1px solid #c8b99a; padding: 6px 10px; text-align: left; vertical-align: top; }
  .notes th { background: #f3ead6; white-space: nowrap; }
  .notes p { margin: 4px 0; }

  /* ナビゲーション（ページによって位置が変わらないよう、全ページ共通で1組だけ固定配置） */
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 70px; height: 70px; padding: 0;
    font-size: 36px; border: none; border-radius: 50%; cursor: pointer; z-index: 200;
    background: rgba(139,195,74,.85); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; transition: background .2s, transform .2s; }
  .nav:hover { background: #7cb342; transform: translateY(-50%) scale(1.1); }
  .nav[aria-disabled="true"] { visibility: hidden; }
  #prev { left: 30px; } #next { right: 30px; }

  #pageNo { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 200;
    background: rgba(0,0,0,.45); color: #fff; font-size: 14px; padding: 3px 14px; border-radius: 20px; }
  #restart { position: fixed; bottom: 30px; right: 30px; z-index: 210; padding: 15px 30px; font-size: 18px;
    font-weight: bold; border: none; border-radius: 50px; cursor: pointer; background: #5d4037; color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.3); visibility: hidden; }
  #restart:hover { background: #3e2723; }

  @media (max-width: 800px) {
    .col { font-size: 18px; padding: 20px; }
    .cover h1 { font-size: 40px; } .cover p { font-size: 16px; }
    .nav { width: 50px; height: 50px; font-size: 24px; } #prev { left: 10px; } #next { right: 10px; }
    .sort { width: 88%; padding: 10px; } .sort .row { gap: 8px; } .sort .pc, .sort .slot { font-size: 13px; height: 54px; } .sort .msg { font-size: 16px; }
    .notes { inset: 20px 66px 70px 66px; font-size: 14px; padding: 16px; }
    .chapter { font-size: 14px; }
    .term { font-size: 12px; padding: 4px 10px; white-space: normal; } .term .w { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="book">
  <div id="spine"></div>
  <div id="pages"></div>
  <button class="nav" id="prev" aria-label="まえのページ">◀</button>
  <button class="nav" id="next" aria-label="つぎのページ">▶</button>
  <button id="restart">さいしょへもどる 🔄</button>
  <div id="pageNo"></div>
</div>

<script>
/* ===== 絵の部品（すべてオリジナルのSVG） ===== */
const INK = "#6e4a36";
const C = {
  sq: "#d9935f", sqL: "#e8ae7c", cream: "#fbecd3",
  rb: "#f1e3d2", rbD: "#cdb393", pink: "#f4a7b3",
  fx: "#f2793a", fxL: "#f3955a", white: "#fffaf2",
  owl: "#b58a62", owlL: "#e2c7a2", owlD: "#8c6544",
  bird: "#7fbff0", birdD: "#4a86c2", yel: "#f6d36b",
  bear: "#b07e55", bearL: "#e2bf96", mouse: "#cfc8c2",
  wood: "#c08348", woodD: "#8f5a2e", metal: "#a9b0bb", metalD: "#6f7682",
  gold: "#f2c14e", goldD: "#b9862a", silver: "#d5dbe3", silverD: "#7d8693",
  green: "#7cb85a", greenD: "#4f8f3a", hat: "#6e9a4a", red: "#d9534f",
};
const ln = (w = 2.8) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, s = 1, flip = false, rot = 0) =>
  `transform="translate(${x} ${y}) rotate(${rot}) scale(${flip ? -s : s} ${s})"`;
const G = (inner, x, y, s = 1, flip = false, rot = 0) => `<g ${T(x, y, s, flip, rot)}>${inner}</g>`;

/* ---- かわいい顔（大きな目に ハイライト） ---- */
function eyes(x1, x2, y, mood, r = 10) {
  const big = (x) => `<ellipse cx="${x}" cy="${y}" rx="${r * 0.82}" ry="${r}" fill="#3a2a22"/>
    <circle cx="${x + r * 0.28}" cy="${y - r * 0.42}" r="${r * 0.36}" fill="#fff"/>
    <circle cx="${x - r * 0.3}" cy="${y + r * 0.38}" r="${r * 0.16}" fill="#fff"/>`;
  const arc = (x, up) => up
    ? `<path d="M${x - r * 0.9} ${y + 3} Q${x} ${y - r * 1.1} ${x + r * 0.9} ${y + 3}" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M${x - r * 0.9} ${y - 2} Q${x} ${y + r * 0.9} ${x + r * 0.9} ${y - 2}" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>`;
  switch (mood) {
    case "joy": return arc(x1, true) + arc(x2, true);
    case "tired": return arc(x1, false) + arc(x2, false);
    case "sly": return big(x1) + big(x2) +
      `<path d="M${x1 - r} ${y - r * 0.55} Q${x1} ${y - r * 0.9} ${x1 + r} ${y - r * 0.4} L${x1 + r} ${y - r * 1.3} L${x1 - r} ${y - r * 1.3} Z" fill="${C.fx}"/>
       <path d="M${x2 - r} ${y - r * 0.4} Q${x2} ${y - r * 0.9} ${x2 + r} ${y - r * 0.55} L${x2 + r} ${y - r * 1.3} L${x2 - r} ${y - r * 1.3} Z" fill="${C.fx}"/>
       <path d="M${x1 - r} ${y - r * 0.5} Q${x1} ${y - r * 0.85} ${x1 + r} ${y - r * 0.4} M${x2 - r} ${y - r * 0.4} Q${x2} ${y - r * 0.85} ${x2 + r} ${y - r * 0.5}" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>`;
    case "surprised": return `<circle cx="${x1}" cy="${y}" r="${r * 0.75}" fill="#3a2a22"/><circle cx="${x1 + 2}" cy="${y - 3}" r="${r * 0.28}" fill="#fff"/>
      <circle cx="${x2}" cy="${y}" r="${r * 0.75}" fill="#3a2a22"/><circle cx="${x2 + 2}" cy="${y - 3}" r="${r * 0.28}" fill="#fff"/>`;
    case "sad": return big(x1) + big(x2) +
      `<path d="M${x1 - r} ${y - r * 1.5} Q${x1} ${y - r * 1.9} ${x1 + r} ${y - r * 1.8} M${x2 - r} ${y - r * 1.8} Q${x2} ${y - r * 1.9} ${x2 + r} ${y - r * 1.5}" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
       <path d="M${x1 - r * 0.2} ${y + r * 1.1} q-4 8 0 12 q4 -4 0 -12 Z" fill="#9fd0f5"/>`;
    default: return big(x1) + big(x2);
  }
}
function mouth(x, y, mood, w = 8) {
  switch (mood) {
    case "joy": return `<path d="M${x - w} ${y - 1} Q${x} ${y + w * 1.5} ${x + w} ${y - 1} Z" fill="#e2747a" stroke="#3a2a22" stroke-width="2.5" stroke-linejoin="round"/>`;
    case "sad": return `<path d="M${x - w * 0.6} ${y + 4} Q${x} ${y - 2} ${x + w * 0.6} ${y + 4}" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    case "tired": return `<path d="M${x - w * 0.8} ${y + 2} q${w * 0.4} -4 ${w * 0.8} 0 t${w * 0.8} 0" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    case "surprised": return `<ellipse cx="${x}" cy="${y + 3}" rx="${w * 0.4}" ry="${w * 0.55}" fill="#e2747a" stroke="#3a2a22" stroke-width="2.5"/>`;
    case "sly": return `<path d="M${x - w} ${y} Q${x + w * 0.3} ${y + w * 0.9} ${x + w * 1.1} ${y - w * 0.4}" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    default: return `<path d="M${x - w} ${y - 1} q${w / 2} ${w * 0.7} ${w} 0 q${w / 2} ${w * 0.7} ${w} 0" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
  }
}
const cheeks = (x1, x2, y, r = 12) =>
  `<ellipse cx="${x1}" cy="${y}" rx="${r}" ry="${r * 0.6}" fill="#ff9fb0" opacity=".7"/><ellipse cx="${x2}" cy="${y}" rx="${r}" ry="${r * 0.6}" fill="#ff9fb0" opacity=".7"/>`;
function holding(item, hy) { return item ? `<g transform="translate(0 ${hy})">${item}</g>` : ""; }
/* 小さな まるい手 */
function arms(col, hy, hw = 22, up = false) {
  const paw = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="11" ry="10" fill="${col}" ${ln(2.5)}/>
    <path d="M${x - 4} ${y - 8} v5 M${x + 4} ${y - 8} v5" stroke="#6e4a36" stroke-width="1.8" stroke-linecap="round"/>`;
  return up ? paw(-hw, hy + 4) + paw(46, hy - 50) : paw(-hw, hy + 4) + paw(hw, hy + 4);
}
/* からだ（あたま大きめ）の共通部分 */
function chibi(o) {
  const hy = -150, hr = o.hr || 64;
  return `
  ${o.back || ""}
  <ellipse cx="-18" cy="-6" rx="17" ry="9" fill="${o.foot || o.col}" ${ln(2.5)}/><ellipse cx="18" cy="-6" rx="17" ry="9" fill="${o.foot || o.col}" ${ln(2.5)}/>
  <ellipse cx="0" cy="-48" rx="${o.bw || 40}" ry="44" fill="${o.col}" ${ln(2.8)}/>
  <ellipse cx="0" cy="-42" rx="${(o.bw || 40) * 0.6}" ry="30" fill="${o.belly}"/>
  ${o.neck || ""}
  ${o.ears || ""}
  <ellipse cx="0" cy="${hy}" rx="${hr + 4}" ry="${hr}" fill="${o.col}" ${ln(2.8)}/>
  ${o.face || ""}
  ${eyes(-24, 24, hy + 2, o.mood, 11)}
  ${cheeks(-40, 40, hy + 22)}
  ${o.nose || `<ellipse cx="0" cy="${hy + 16}" rx="5" ry="3.8" fill="#5a3a2e"/>`}
  ${mouth(0, hy + 25, o.mood, 7)}
  ${o.top || ""}
  ${holding(o.hold, -60)}
  ${o.noArms ? "" : arms(o.col, -62, o.hw ?? 22, o.armUp)}`;
}

/* ---- リスさん（きいろの スカーフ） ---- */
function squirrel(o = {}) {
  return `<g>${chibi({
    ...o, mood: o.mood || "happy", col: C.sq, belly: C.cream,
    back: `<path d="M-20 -30 C-90 -10 -128 -90 -100 -150 C-80 -196 -20 -196 -26 -150 C-30 -122 -70 -128 -66 -96 C-62 -70 -44 -56 -24 -60 Z" fill="${C.sqL}" ${ln(2.8)}/>
           <path d="M-88 -150 C-74 -176 -44 -178 -40 -156" fill="none" stroke="#fff3df" stroke-width="7" stroke-linecap="round" opacity=".8"/>`,
    ears: `<path d="M-58 -184 Q-76 -262 -28 -206 Z" fill="${C.sq}" ${ln(2.8)}/><path d="M58 -184 Q76 -262 28 -206 Z" fill="${C.sq}" ${ln(2.8)}/>
           <path d="M-52 -196 Q-64 -240 -36 -208 Z M52 -196 Q64 -240 36 -208 Z" fill="#ffc6a8"/>
           <path d="M-64 -232 l-8 -10 M-64 -232 l0 -14 M64 -232 l8 -10 M64 -232 l0 -14" ${ln(2.4)}/>`,
    face: `<ellipse cx="0" cy="-128" rx="34" ry="22" fill="${C.cream}"/>`,
    neck: `<path d="M-34 -88 Q0 -72 34 -88 L32 -76 Q0 -62 -32 -76 Z" fill="#f6cf4f" ${ln(2.5)}/><path d="M18 -78 l10 22 l10 -6 Z" fill="#f6cf4f" ${ln(2.2)}/>`,
  })}</g>`;
}
/* ---- ウサギさん（あおい リボン） ---- */
function rabbit(o = {}) {
  const droop = o.mood === "sad" || o.mood === "tired";
  const ear = (x, r) => `<g transform="rotate(${r} ${x} -200)"><ellipse cx="${x}" cy="-252" rx="19" ry="50" fill="${C.rb}" ${ln(2.8)}/><ellipse cx="${x}" cy="-248" rx="9" ry="36" fill="#ffc2cc"/></g>`;
  return `<g>${chibi({
    ...o, mood: o.mood || "happy", col: C.rb, belly: "#fffaf3",
    back: `<circle cx="-40" cy="-30" r="14" fill="#fff" ${ln(2.5)}/>`,
    ears: ear(-24, droop ? -40 : -10) + ear(24, droop ? 40 : 10),
    face: `<ellipse cx="0" cy="-130" rx="30" ry="20" fill="#fffaf3"/>`,
    nose: `<path d="M-5 -136 L5 -136 L0 -130 Z" fill="#f48a9c" stroke="#3a2a22" stroke-width="1.6"/>`,
    top: `<g transform="translate(34 -206)"><path d="M0 0 L-20 -12 L-20 12 Z M0 0 L20 -12 L20 12 Z" fill="#7fb6e8" ${ln(2.2)}/><circle cx="0" cy="0" r="6" fill="#7fb6e8" ${ln(2.2)}/></g>`,
  })}</g>`;
}
/* ---- キツネさん（みどりの ぼうし） ---- */
function fox(o = {}) {
  return `<g>${chibi({
    ...o, mood: o.mood || "sly", col: C.fx, belly: C.white, foot: "#6b4535",
    back: `<path d="M-22 -30 C-80 -24 -138 -60 -136 -116 C-116 -100 -88 -94 -70 -98 C-56 -76 -40 -64 -22 -62 Z" fill="${C.fx}" ${ln(2.8)}/>
           <path d="M-136 -116 C-128 -100 -112 -94 -96 -96 C-106 -110 -120 -116 -136 -116 Z" fill="${C.white}"/>`,
    ears: `<path d="M-56 -184 L-62 -240 L-20 -206 Z" fill="${C.fx}" ${ln(2.8)}/><path d="M56 -184 L62 -240 L20 -206 Z" fill="${C.fx}" ${ln(2.8)}/>
           <path d="M-52 -194 L-56 -226 L-30 -206 Z M52 -194 L56 -226 L30 -206 Z" fill="#6b4535"/>`,
    face: `<path d="M-64 -146 Q-34 -126 0 -132 Q34 -126 64 -146 Q56 -96 0 -92 Q-56 -96 -64 -146 Z" fill="${C.white}"/>`,
    top: o.noHat ? "" : `<path d="M-40 -204 Q-38 -240 0 -242 Q38 -240 40 -204 Z" fill="${C.hat}" ${ln(2.8)}/>
       <ellipse cx="0" cy="-204" rx="58" ry="12" fill="${C.hat}" ${ln(2.8)}/><path d="M14 -236 q12 -14 22 -4 q-10 2 -22 4 Z" fill="#a7d26a" ${ln(2)}/>`,
  })}</g>`;
}
/* ---- フクロウはかせ ---- */
function owl(o = {}) {
  const m = o.mood || "happy";
  const wingR = o.wingUp
    ? `<path d="M56 -130 C96 -150 112 -200 100 -224 C80 -206 64 -180 50 -162 Z" fill="${C.owlD}" ${ln(2.8)}/>`
    : `<path d="M60 -140 C90 -120 92 -70 72 -48 C64 -84 58 -110 54 -128 Z" fill="${C.owlD}" ${ln(2.8)}/>`;
  return `<g>
  <path d="M-24 -4 l-7 7 M-24 -4 l0 9 M-24 -4 l7 7 M24 -4 l-7 7 M24 -4 l0 9 M24 -4 l7 7" stroke="#e8a046" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="0" cy="-104" rx="76" ry="100" fill="${C.owl}" ${ln(2.8)}/>
  <ellipse cx="0" cy="-70" rx="46" ry="56" fill="${C.owlL}"/>
  <path d="M-26 -84 q7 7 14 0 q7 7 14 0 q7 7 14 0 M-32 -58 q7 7 14 0 q7 7 14 0 q7 7 14 0 q7 7 14 0" fill="none" stroke="${C.owlD}" stroke-width="2.5" opacity=".5"/>
  <path d="M-60 -140 C-90 -120 -92 -70 -72 -48 C-64 -84 -58 -110 -54 -128 Z" fill="${C.owlD}" ${ln(2.8)}/>
  ${wingR}
  <path d="M-56 -186 L-66 -222 L-30 -196 Z M56 -186 L66 -222 L30 -196 Z" fill="${C.owl}" ${ln(2.8)}/>
  <circle cx="-28" cy="-150" r="27" fill="#fff8ea"/><circle cx="28" cy="-150" r="27" fill="#fff8ea"/>
  ${eyes(-28, 28, -150, m, 12)}
  <circle cx="-28" cy="-150" r="24" fill="none" stroke="#4a4a52" stroke-width="3.5"/><circle cx="28" cy="-150" r="24" fill="none" stroke="#4a4a52" stroke-width="3.5"/>
  <path d="M-4 -150 L4 -150" stroke="#4a4a52" stroke-width="3.5"/>
  ${cheeks(-50, 50, -122, 10)}
  <path d="M-8 -128 L8 -128 L0 -114 Z" fill="#f0a640" stroke="#3a2a22" stroke-width="2"/>

<h3>● パケットとパケット交換方式</h3>
<p>大きなデータは小さなパケットに分けて送ります。各パケットには宛先や順番などを記したヘッダが付いていて、ルータはヘッダの宛先を見て転送し、受信側はヘッダの番号で元の順に並べ直します。一つの通信が回線を長く占有しないので、多くの利用者が回線を効率よく共有できます。また、一部が届かなくても、そのパケットだけを送り直せば済みます。</p>

  const nb = (n) => `<span class="n" style="background:${PC[n]}">${n}</span>`;
  return `<div class="sort">
    <div class="lbl">ついた じゅん（クマさんの おてがみ）</div>
    <div class="row">${ARRIVE.map(n => `<button class="pc" data-n="${n}">${nb(n)}${PIECES[n - 1]}</button>`).join("")}</div>
    <div class="arrow">▼ ばんごうの じゅんに ならべよう ▼</div>
    <div class="row">${[1, 2, 3, 4].map(n => `<div class="slot" data-n="${n}">${nb(n)}<span class="t"></span></div>`).join("")}</div>
    <div class="msg" id="sMsg"></div>
    <div class="hint" id="sHint"></div>
    <button class="again" id="sAgain">もういちど</button>
  </div>`;
}

/* ===== ページ生成 ===== */
const root = document.getElementById("pages");
PAGES.forEach((p, i) => {
  const d = document.createElement("div");
  d.className = "spread";
  d.id = "spread-" + i;
  let html = scene(SCENES[p.scene]());
  if (p.type === "cover") {
    html += `<div class="cover"><h1>とどけ！ もりの おてがみ</h1>
      <p>～ ことりさんと プロトコルの おはなし ～</p></div>`;
  } else if (p.type === "notes") {
    html += `<div class="notes">${NOTES}</div>`;
  } else {
    if (p.ch) html += `<div class="chapter">${p.ch}</div>`;
    html += `<div class="overlay"><div class="col left"><div>${p.left || ""}</div>${p.term ? `<div class="term"><b>じょうほうの ことば</b>${p.term}</div>` : ""}</div>
             <div class="col right">${p.right || ""}</div></div>`;
    if (p.play) html += sortHTML();
  }
  d.innerHTML = html;
  root.appendChild(d);
});

/* ならべかえの 動き */
let want = 1;
const sMsg = document.getElementById("sMsg"), sHint = document.getElementById("sHint");
function resetSort() {
  want = 1;
  document.querySelectorAll(".sort .pc").forEach(b => { b.classList.remove("used", "ng"); b.disabled = false; });
  document.querySelectorAll(".sort .slot").forEach(s => { s.classList.remove("on"); s.querySelector(".t").textContent = ""; });
  sMsg.textContent = "";
  sHint.textContent = "1ばんから じゅんに おしてね";
}
document.querySelectorAll(".sort .pc").forEach(b => b.onclick = () => {
  const n = +b.dataset.n;
  if (n !== want) {
    b.classList.remove("ng"); void b.offsetWidth; b.classList.add("ng");
    sHint.textContent = `それは ${n}ばん。つぎは ${want}ばん だよ`;
    return;
  }
  b.classList.add("used"); b.disabled = true;
  const slot = document.querySelector(`.sort .slot[data-n="${n}"]`);
  slot.classList.add("on"); slot.querySelector(".t").textContent = PIECES[n - 1];
  want++;
  if (want > PIECES.length) {
    sMsg.textContent = PIECES.join(" ");
    sHint.textContent = "よめた！ ばんごうの おかげで もとどおり。";
  } else sHint.textContent = `いいね！ つぎは ${want}ばん`;
});
document.getElementById("sAgain").onclick = resetSort;
resetSort();

/* ===== ページめくり ===== */
let cur = 0;
const total = PAGES.length;
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const restartBtn = document.getElementById("restart");

function show(n) {
  document.getElementById("spread-" + cur).classList.remove("active");
  cur = n;
  document.getElementById("spread-" + cur).classList.add("active");
  prevBtn.setAttribute("aria-disabled", cur === 0);
  nextBtn.setAttribute("aria-disabled", cur === total - 1);
  restartBtn.style.visibility = cur === total - 1 ? "visible" : "hidden";
  document.getElementById("pageNo").textContent = `${cur + 1} / ${total}`;
}
function go(dir) { const n = cur + dir; if (n >= 0 && n < total) show(n); }
prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);
restartBtn.onclick = () => { resetSort(); show(0); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
show(0);
</script>

    if (!own.board) return m(1, 'ぶひんをつなぐ土台がないので、動かない（マザーボードがない）');
    if (!own.cpu) return m(1, '電源は入るが、命令を実行する部品がないので動かない（CPUがない）');
    if (!own.mem) return m(1, '電源は入るが、作業する場所がないので起動できない（メモリがない）');
    if (!store) return m(2, '動き出したが、データをしまう場所がない（SSD か HDD がない）');
    if (!own.os) return m(2, '動き出したが、OS が入っていないので起動できない（OS がない）');
    var slow = own.ssd ? '' : '（HDDなので、起動に時間がかかる）';
    if (!own.disp) return m(3, '起動したが、画面がないので何も見えない（ディスプレイがない）' + slow);
    if (!own.hdmi) return m(3, '起動したが、ディスプレイにつながっていないので映らない（HDMIケーブルがない）');
    if (!own.kbd || !own.mouse) return m(4, '画面に映った！ でも、' + (!own.kbd && !own.mouse ? 'キーボードとマウス' : !own.kbd ? 'キーボード' : 'マウス') + 'がないので操作できない' + slow);
    if (!own.usb) return m(4, '画面に映った！ でも、キーボードとマウスが本体につながっていない（USBケーブルがない）');
    if (!net) return m(5, '🎉 班PCが使えるようになった！ ' + (!own.router ? '（インターネットには、ルータがないのでつながらない）' : !own.lan ? '（インターネットには、LANケーブルがないのでつながらない）' : '（インターネットには、通信のきまり TCP/IP がないのでつながらない）') + slow);
    if (!own.browser) return m(6, '🎉 班PCが使えるようになった！ インターネットにもつながった（Webブラウザがあれば、Webページが見られる）' + slow);
    return m(7, '🎉 班PCが使えるようになった！ インターネットにつながって、Webページも見られる' + (own.sec ? '（暗号化で安全に）' : '') + slow);
  }
  function pcSvg(hi, cls) {
    var own = owned(), st = pcState(own);
    var order = DRAW_ORDER;
    var g = order.map(function (k) {
      var has = !!own[k];
      return '<g class="' + (has ? 'pcHas' : 'pcGhost') + (k === hi ? ' pcHi' : '') + '">' + PART_SVG[k] + '</g>';
    }).join('');
    return '<svg class="' + (cls || 'pcSvg') + '" viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="班PCの完成状況">' +
      '<style>.pcGhost *{fill:none!important;stroke:#64748b!important;stroke-width:1.3!important;stroke-dasharray:4 3}.pcGhost{opacity:.55}.pcGhost text{fill:#64748b!important;stroke:none!important}' +
      '.pcHi{animation:pcHi 1.2s ease-in-out infinite}.pcHi path{stroke-width:5!important}@keyframes pcHi{0%,100%{filter:drop-shadow(0 0 0 #facc15)}50%{filter:drop-shadow(0 0 6px #facc15)}}' +
      (st.shown ? '' : '.pcHas .pcScreen{fill:#020617!important}') + '@media (prefers-reduced-motion:reduce){.pcHi{animation:none;filter:drop-shadow(0 0 4px #facc15)}}</style>' +
      OUTLETS + CASE_SVG + g +
      (own.disp && own.hdmi && st.post && !st.boot ? '<text x="34" y="46" font-size="9" font-weight="700" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace">No bootable device.</text><text x="34" y="60" font-size="9" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace">Insert boot disk_</text>' : '') +
      (st.shown ? '<g font-family="system-ui,sans-serif"><text x="105" y="80" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">' + (st.usable ? '班PC Ready!' : 'Hello!') + '</text><g fill="#e0f2fe" opacity=".85"><rect x="34" y="34" width="14" height="12" rx="2"/><rect x="34" y="52" width="14" height="12" rx="2"/><rect x="34" y="70" width="14" height="12" rx="2"/></g><rect x="26" y="114" width="158" height="10" fill="#0369a1"/></g>' : '') +
      (st.power && own.board ? '<circle cx="330" cy="30" r="3" fill="' + (st.post ? '#4ade80' : '#f59e0b') + '"/>' : '') + (st.shown && st.web ? '<text x="180" y="121" text-anchor="end" font-size="9" fill="#fff" font-family="system-ui,sans-serif">🌐</text>' : '') + (st.shown ? '<text x="30" y="121" font-size="7" fill="#e0f2fe" font-family="system-ui,sans-serif">' + (st.fast ? 'SSD' : 'HDD') + '</text>' : '') +
      '</svg>';
  }

  // ぶひんのカード（どのページのデザインにも合うよう、スタイルは中に書く）
  function partCard(id, opt) {
    var p = part(id); if (!p) return '';
    opt = opt || {};
    var cab = p.type === 'cable', col = cab ? '#f87171' : '#facc15';
    return '<div style="margin:14px auto;max-width:560px;background:#020617;border:' + (cab ? 3 : 2) + 'px solid ' + col + ';border-radius:14px;padding:14px 18px;color:#e2e8f0;font:700 15px/1.7 system-ui,-apple-system,\'Hiragino Sans\',sans-serif;text-align:center' + (cab ? ';box-shadow:0 0 18px rgba(248,113,113,.45)' : '') + '">' +
      '<div style="color:' + (cab ? '#fecaca' : '#fde68a') + ';font-size:17px;font-weight:900">' + (cab ? '🔌 スキルクリア！ 班PCの ケーブル を手に入れた！' : TYPE_ICON[p.type] + ' 班PCの ぶひん（' + (p.type === 'soft' ? 'ソフトウェア' : 'ハードウェア') + '）を手に入れた！') + '</div>' +
      '<div style="max-width:300px;margin:6px auto">' + pcSvg(p.id, 'pcSvgCard').replace('<svg ', '<svg style="width:100%;height:auto;display:block" ') + '</div>' +
      '<div style="font-size:20px;font-weight:900;color:#fef3c7">' + p.name + '</div>' +
      '<div style="font-size:14px;color:#cbd5e1">' + p.can + '</div>' +
      '<div style="margin-top:6px;font-size:13px;color:#94a3b8">いまの班PC：' + pcState().msg + '</div>' +
      (opt.link === false ? '' : '<a href="index.html" style="display:inline-block;margin-top:8px;background:#0ea5e9;color:#fff;border-radius:10px;padding:6px 16px;text-decoration:none">📱 Tの端末にもどる</a>') +
      '</div>';
  }

  // えほん：確認クイズを見張って、全問正解ならぶひんを出す。まちがいがあれば「もう一度」
  function autoQuiz(id) {
    function setup() {
      var score = document.getElementById('score');
      if (!score) return;
      var box = document.createElement('div');
      box.id = 'hubBox';
      var host = score.closest ? score.closest('.qhead') : null;
      (host && host.parentNode ? host.parentNode : score.parentNode).insertBefore(box, host ? host.nextSibling : score.nextSibling);
      var page = score.parentNode && score.parentNode.closest ? score.parentNode.closest('[id]') : null;
      function retry() {
        location.hash = page ? page.id : '';
        location.reload();
      }
      var note = function (t) { return '<div style="margin:10px auto;max-width:560px;text-align:center;font:700 14px/1.6 system-ui,sans-serif;color:#64748b">' + t + '</div>'; };
      function update() {
        var t = score.textContent || '';
        if (t.indexOf('全問正解') >= 0) { clear(id); box.innerHTML = partCard(id); return; }
        if (/問正解。/.test(t)) {
          box.innerHTML = '<div style="margin:12px auto;max-width:560px;text-align:center;font:700 15px/1.7 system-ui,sans-serif;color:#475569">全問正解で、班PCの ぶひん が手に入る。' +
            '<br><button type="button" id="hubRetryBtn" style="margin-top:6px;font:inherit;background:#0ea5e9;color:#fff;border:0;border-radius:10px;padding:6px 18px;cursor:pointer">🔁 もう一度ちょうせんする</button></div>';
          var b = document.getElementById('hubRetryBtn'); if (b) b.onclick = retry;
          return;
        }
        var p = part(id);
        box.innerHTML = p ? note('✓ クリアずみ（ぶひん：' + p.name + '）') : note('🔧 全問正解すると、班PCの ぶひん が手に入る');
      }
      new MutationObserver(update).observe(score, { childList: true, characterData: true, subtree: true });
      update();
      // Tの端末へもどるボタン（右下）
      var a = document.createElement('a');
      a.href = 'index.html'; a.textContent = '📱 Tの端末';
      a.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:9999;background:#0f172a;color:#fde68a;border:2px solid #facc15;border-radius:999px;padding:6px 14px;font:800 14px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35)');
      document.body.appendChild(a);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup); else setup();
  }

  window.DroneHub = {
    ITEMS: ITEMS, GEAR: GEAR, TYPE_ICON: TYPE_ICON, kindOf: kindOf, item: item, isCleared: isCleared, clear: clear, isOpen: isOpen,
    part: part, parts: parts, pcSvg: pcSvg, pcState: pcState, partCard: partCard, pieceCard: partCard,
    autoQuiz: autoQuiz, team: team, visible: visible, lockedGroup: lockedGroup, setGroup: setGroup,
    reset: function () { try { localStorage.removeItem(KEY); } catch (e) { /* なし */ } }
  };
})();

/* ==== HUB END ==== */</script>
<script>
  // ==== Tの端末：さいごのページまで読んだら「よんだ」の印をつける ====
  (function () {
    var ID = 'protocolEhon';
    var a = document.createElement('a');
    a.href = 'index.html'; a.textContent = '📱 Tの端末';
    a.setAttribute('style', 'position:fixed;right:12px;top:12px;z-index:300;background:#0f172a;color:#fde68a;border:2px solid #facc15;border-radius:999px;padding:5px 14px;font:800 14px system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35)');
    document.body.appendChild(a);
    var note = document.createElement('div');
    note.setAttribute('style', 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:300;background:#14532d;color:#dcfce7;border:2px solid #4ade80;border-radius:12px;padding:6px 16px;font:800 15px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35);display:none');
    note.textContent = '📖 さいごまで よんだ！ Tの端末に「よんだ」の しるしが ついたよ';
    document.body.appendChild(note);
    var pn = document.getElementById('pageNo');
    function check() {
      var m = String(pn && pn.textContent || '').match(/(\d+)\s*\/\s*(\d+)/);
      if (m && m[1] === m[2] && window.DroneHub) {
        var first = !DroneHub.isCleared(ID);
        var had = DroneHub.parts().some(function (p) { return p.id === 'tcpip'; });   // パケットとプロトコルのクイズで、もう手に入れている
        DroneHub.clear(ID);
        if (first) {
          var pt = DroneHub.part(ID);
          note.textContent = '📖 さいごまで よんだ！' + (pt ? (had ? ' ぶひん「' + pt.name + '」は、クイズでもう手に入れているよ' : ' 班PCの ぶひん「' + pt.name + '」を手に入れた！') : '');
          note.style.display = 'block'; setTimeout(function () { note.style.display = 'none'; }, 6000);
        }
      }
    }
    if (pn) new MutationObserver(check).observe(pn, { childList: true, characterData: true, subtree: true });
    check();
  })();
</script>
