<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひみつの おてがみ ― 暗号のおはなし</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: #222; margin: 0; height: 100vh; overflow: hidden;
  }
  #book { position: relative; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
  #spine { position: absolute; left: 50%; top: 0; bottom: 0; width: 60px; margin-left: -30px;
    background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.1) 50%, rgba(0,0,0,0));
    z-index: 100; pointer-events: none; }

  .spread { position: absolute; inset: 0; display: none; }
  .spread.active { display: block; animation: fadeIn .5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; display: block; }


  .overlay { position: absolute; inset: 0; display: flex; z-index: 50; pointer-events: none; }
  .col { flex: 1 1 0; min-width: 0; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column;
    font-size: 26px; line-height: 1.75; color: #333; font-weight: 800; text-align: center;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff,
                 2px 0 0 #fff, -2px 0 0 #fff, 0 2px 0 #fff, 0 -2px 0 #fff, 3px 3px 5px rgba(0,0,0,.2); }
  .col.left { justify-content: flex-start; padding-top: 60px; }
  .col.right { justify-content: flex-start; padding-top: 60px; }

  /* 表紙 */
  .cover { position: absolute; top: 26%; left: 50%; transform: translate(-50%, -50%);
    z-index: 60; text-align: center; width: 80%; }
  .cover h1 { font-size: 72px; color: #5d4037; margin: 0;
    text-shadow: 4px 4px 0 #fff, -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff; }
  .cover p { font-size: 24px; font-weight: bold; color: #5d4037; text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff; }

  /* 章タイトル */
  /* 情報Ⅰの用語 */
  .term { align-self: center; margin-top: 14px; text-shadow: none; max-width: 100%; box-sizing: border-box; white-space: normal !important;
    background: rgba(255,255,255,.94); border: 3px solid #4a86c2; border-radius: 14px;
    padding: 6px 16px; color: #2c4f78; font-size: 16px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.18); text-align: center; line-height: 1.5; }
  .term b { display: inline-block; background: #4a86c2; color: #fff; border-radius: 8px; padding: 0 8px; margin-right: 8px; font-size: 14px; vertical-align: 2px; }
  .term .w { font-size: 22px; color: #1f3d63; white-space: nowrap; }
  .chapter { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: rgba(93,64,55,.88); color: #fff; padding: 6px 22px; border-radius: 30px;
    font-size: 18px; font-weight: bold; letter-spacing: .1em; white-space: nowrap; }

  /* シーザー暗号の体験パネル */
  .play { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 70;
    background: rgba(255,253,245,.96); border: 4px solid #8d6e63; border-radius: 20px;
    padding: 18px 26px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); width: 580px; }
  .play .lbl { font-size: 15px; color: #6d4c41; font-weight: bold; }
  .play .msg { font-size: 36px; font-weight: 900; letter-spacing: .1em; color: #3e2723; margin: 6px 0 10px; min-height: 1.3em; }
  .play .msg.ok { color: #2e7d32; }
  .play .row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .play button { width: 52px; height: 52px; border-radius: 50%; border: none; font-size: 26px; font-weight: bold;
    background: #8bc34a; color: #fff; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .play button:hover { background: #7cb342; }
  .play .num { width: 150px; font-size: 22px; font-weight: bold; color: #3e2723; }
  .play .hint { font-size: 14px; color: #6d4c41; margin-top: 8px; min-height: 1.4em; }

  /* 解説ページ */
  .notes { position: absolute; inset: 40px 120px 90px 120px; z-index: 70; overflow-y: auto;
    background: rgba(255,255,255,.95); border-radius: 18px; padding: 26px 34px; box-sizing: border-box;
    color: #222; font-size: 16px; line-height: 1.75; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .notes h2 { margin: 0 0 10px; font-size: 22px; color: #5d4037; }
  .notes h3 { margin: 18px 0 4px; font-size: 17px; color: #33691e; }
  .notes table { border-collapse: collapse; width: 100%; margin: 6px 0 4px; font-size: 15px; }
  .notes th, .notes td { border: 1px solid #c8b99a; padding: 6px 10px; text-align: left; vertical-align: top; }
  .notes th { background: #f3ead6; white-space: nowrap; }
  .notes p { margin: 4px 0; }

  /* ナビゲーション（ページによって位置が変わらないよう、全ページ共通で1組だけ固定配置） */
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 70px; height: 70px; padding: 0;
    font-size: 36px; border: none; border-radius: 50%; cursor: pointer; z-index: 200;
    background: rgba(139,195,74,.85); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; transition: background .2s, transform .2s; }
  .nav:hover { background: #7cb342; transform: translateY(-50%) scale(1.1); }
  .nav[aria-disabled="true"] { visibility: hidden; }
  #prev { left: 30px; } #next { right: 30px; }

  #pageNo { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 200;
    background: rgba(0,0,0,.45); color: #fff; font-size: 14px; padding: 3px 14px; border-radius: 20px; }
  #restart { position: fixed; bottom: 30px; right: 30px; z-index: 210; padding: 15px 30px; font-size: 18px;
    font-weight: bold; border: none; border-radius: 50px; cursor: pointer; background: #5d4037; color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.3); visibility: hidden; }
  #restart:hover { background: #3e2723; }

  @media (max-width: 800px) {
    .col { font-size: 18px; padding: 20px; }
    .cover h1 { font-size: 40px; } .cover p { font-size: 16px; }
    .nav { width: 50px; height: 50px; font-size: 24px; } #prev { left: 10px; } #next { right: 10px; }
    .play { width: 82%; padding: 12px; } .play .msg { font-size: 28px; }
    .notes { inset: 20px 66px 70px 66px; font-size: 14px; padding: 16px; }
    .chapter { font-size: 14px; }
    .term { font-size: 12px; padding: 4px 10px; white-space: normal; } .term .w { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="book">
  <div id="spine"></div>
  <div id="pages"></div>
  <button class="nav" id="prev" aria-label="まえのページ">◀</button>
  <button class="nav" id="next" aria-label="つぎのページ">▶</button>
  <button id="restart">さいしょへもどる 🔄</button>
  <div id="pageNo"></div>
</div>

<script>
/* ===== 絵の部品（すべてオリジナルのSVG） ===== */
const INK = "#6e4a36";
const C = {
  sq: "#d9935f", sqL: "#e8ae7c", cream: "#fbecd3",
  rb: "#f1e3d2", rbD: "#cdb393", pink: "#f4a7b3",
  fx: "#f2793a", fxL: "#f3955a", white: "#fffaf2",
  owl: "#b58a62", owlL: "#e2c7a2", owlD: "#8c6544",
  bird: "#7fbff0", birdD: "#4a86c2", yel: "#f6d36b",
  bear: "#b07e55", bearL: "#e2bf96", mouse: "#cfc8c2",
  wood: "#c08348", woodD: "#8f5a2e", metal: "#a9b0bb", metalD: "#6f7682",
  gold: "#f2c14e", goldD: "#b9862a", silver: "#d5dbe3", silverD: "#7d8693",
  green: "#7cb85a", greenD: "#4f8f3a", hat: "#6e9a4a", red: "#d9534f",
};
const ln = (w = 2.8) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const T = (x, y, s = 1, flip = false, rot = 0) =>
  `transform="translate(${x} ${y}) rotate(${rot}) scale(${flip ? -s : s} ${s})"`;
const G = (inner, x, y, s = 1, flip = false, rot = 0) => `<g ${T(x, y, s, flip, rot)}>${inner}</g>`;

/* ---- かわいい顔（大きな目に ハイライト） ---- */
function eyes(x1, x2, y, mood, r = 10) {
  const big = (x) => `<ellipse cx="${x}" cy="${y}" rx="${r * 0.82}" ry="${r}" fill="#3a2a22"/>
    <circle cx="${x + r * 0.28}" cy="${y - r * 0.42}" r="${r * 0.36}" fill="#fff"/>
    <circle cx="${x - r * 0.3}" cy="${y + r * 0.38}" r="${r * 0.16}" fill="#fff"/>`;
  const arc = (x, up) => up
    ? `<path d="M${x - r * 0.9} ${y + 3} Q${x} ${y - r * 1.1} ${x + r * 0.9} ${y + 3}" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M${x - r * 0.9} ${y - 2} Q${x} ${y + r * 0.9} ${x + r * 0.9} ${y - 2}" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>`;
  switch (mood) {
    case "joy": return arc(x1, true) + arc(x2, true);
    case "tired": return arc(x1, false) + arc(x2, false);
    case "sly": return big(x1) + big(x2) +
      `<path d="M${x1 - r} ${y - r * 0.55} Q${x1} ${y - r * 0.9} ${x1 + r} ${y - r * 0.4} L${x1 + r} ${y - r * 1.3} L${x1 - r} ${y - r * 1.3} Z" fill="${C.fx}"/>
       <path d="M${x2 - r} ${y - r * 0.4} Q${x2} ${y - r * 0.9} ${x2 + r} ${y - r * 0.55} L${x2 + r} ${y - r * 1.3} L${x2 - r} ${y - r * 1.3} Z" fill="${C.fx}"/>
       <path d="M${x1 - r} ${y - r * 0.5} Q${x1} ${y - r * 0.85} ${x1 + r} ${y - r * 0.4} M${x2 - r} ${y - r * 0.4} Q${x2} ${y - r * 0.85} ${x2 + r} ${y - r * 0.5}" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>`;
    case "surprised": return `<circle cx="${x1}" cy="${y}" r="${r * 0.75}" fill="#3a2a22"/><circle cx="${x1 + 2}" cy="${y - 3}" r="${r * 0.28}" fill="#fff"/>
      <circle cx="${x2}" cy="${y}" r="${r * 0.75}" fill="#3a2a22"/><circle cx="${x2 + 2}" cy="${y - 3}" r="${r * 0.28}" fill="#fff"/>`;
    case "sad": return big(x1) + big(x2) +
      `<path d="M${x1 - r} ${y - r * 1.5} Q${x1} ${y - r * 1.9} ${x1 + r} ${y - r * 1.8} M${x2 - r} ${y - r * 1.8} Q${x2} ${y - r * 1.9} ${x2 + r} ${y - r * 1.5}" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>
       <path d="M${x1 - r * 0.2} ${y + r * 1.1} q-4 8 0 12 q4 -4 0 -12 Z" fill="#9fd0f5"/>`;
    default: return big(x1) + big(x2);
  }
}
function mouth(x, y, mood, w = 8) {
  switch (mood) {
    case "joy": return `<path d="M${x - w} ${y - 1} Q${x} ${y + w * 1.5} ${x + w} ${y - 1} Z" fill="#e2747a" stroke="#3a2a22" stroke-width="2.5" stroke-linejoin="round"/>`;
    case "sad": return `<path d="M${x - w * 0.6} ${y + 4} Q${x} ${y - 2} ${x + w * 0.6} ${y + 4}" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    case "tired": return `<path d="M${x - w * 0.8} ${y + 2} q${w * 0.4} -4 ${w * 0.8} 0 t${w * 0.8} 0" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    case "surprised": return `<ellipse cx="${x}" cy="${y + 3}" rx="${w * 0.4}" ry="${w * 0.55}" fill="#e2747a" stroke="#3a2a22" stroke-width="2.5"/>`;
    case "sly": return `<path d="M${x - w} ${y} Q${x + w * 0.3} ${y + w * 0.9} ${x + w * 1.1} ${y - w * 0.4}" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
    default: return `<path d="M${x - w} ${y - 1} q${w / 2} ${w * 0.7} ${w} 0 q${w / 2} ${w * 0.7} ${w} 0" fill="none" stroke="#3a2a22" stroke-width="2.8" stroke-linecap="round"/>`;
  }
}
const cheeks = (x1, x2, y, r = 12) =>
  `<ellipse cx="${x1}" cy="${y}" rx="${r}" ry="${r * 0.6}" fill="#ff9fb0" opacity=".7"/><ellipse cx="${x2}" cy="${y}" rx="${r}" ry="${r * 0.6}" fill="#ff9fb0" opacity=".7"/>`;
function holding(item, hy) { return item ? `<g transform="translate(0 ${hy})">${item}</g>` : ""; }
/* 小さな まるい手 */
function arms(col, hy, hw = 22, up = false) {
  const paw = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="11" ry="10" fill="${col}" ${ln(2.5)}/>
    <path d="M${x - 4} ${y - 8} v5 M${x + 4} ${y - 8} v5" stroke="#6e4a36" stroke-width="1.8" stroke-linecap="round"/>`;
  return up ? paw(-hw, hy + 4) + paw(46, hy - 50) : paw(-hw, hy + 4) + paw(hw, hy + 4);
}
/* からだ（あたま大きめ）の共通部分 */
function chibi(o) {
  const hy = -150, hr = o.hr || 64;
  return `
  ${o.back || ""}
  <ellipse cx="-18" cy="-6" rx="17" ry="9" fill="${o.foot || o.col}" ${ln(2.5)}/><ellipse cx="18" cy="-6" rx="17" ry="9" fill="${o.foot || o.col}" ${ln(2.5)}/>
  <ellipse cx="0" cy="-48" rx="${o.bw || 40}" ry="44" fill="${o.col}" ${ln(2.8)}/>
  <ellipse cx="0" cy="-42" rx="${(o.bw || 40) * 0.6}" ry="30" fill="${o.belly}"/>
  ${o.neck || ""}
  ${o.ears || ""}
  <ellipse cx="0" cy="${hy}" rx="${hr + 4}" ry="${hr}" fill="${o.col}" ${ln(2.8)}/>
  ${o.face || ""}
  ${eyes(-24, 24, hy + 2, o.mood, 11)}
  ${cheeks(-40, 40, hy + 22)}
  ${o.nose || `<ellipse cx="0" cy="${hy + 16}" rx="5" ry="3.8" fill="#5a3a2e"/>`}
  ${mouth(0, hy + 25, o.mood, 7)}
  ${o.top || ""}
  ${holding(o.hold, -60)}
  ${o.noArms ? "" : arms(o.col, -62, o.hw ?? 22, o.armUp)}`;
}

/* ---- リスさん（きいろの スカーフ） ---- */
function squirrel(o = {}) {
  return `<g>${chibi({
    ...o, mood: o.mood || "happy", col: C.sq, belly: C.cream,
    back: `<path d="M-20 -30 C-90 -10 -128 -90 -100 -150 C-80 -196 -20 -196 -26 -150 C-30 -122 -70 -128 -66 -96 C-62 -70 -44 -56 -24 -60 Z" fill="${C.sqL}" ${ln(2.8)}/>
           <path d="M-88 -150 C-74 -176 -44 -178 -40 -156" fill="none" stroke="#fff3df" stroke-width="7" stroke-linecap="round" opacity=".8"/>`,
    ears: `<path d="M-58 -184 Q-76 -262 -28 -206 Z" fill="${C.sq}" ${ln(2.8)}/><path d="M58 -184 Q76 -262 28 -206 Z" fill="${C.sq}" ${ln(2.8)}/>
           <path d="M-52 -196 Q-64 -240 -36 -208 Z M52 -196 Q64 -240 36 -208 Z" fill="#ffc6a8"/>
           <path d="M-64 -232 l-8 -10 M-64 -232 l0 -14 M64 -232 l8 -10 M64 -232 l0 -14" ${ln(2.4)}/>`,
    face: `<ellipse cx="0" cy="-128" rx="34" ry="22" fill="${C.cream}"/>`,
    neck: `<path d="M-34 -88 Q0 -72 34 -88 L32 -76 Q0 -62 -32 -76 Z" fill="#f6cf4f" ${ln(2.5)}/><path d="M18 -78 l10 22 l10 -6 Z" fill="#f6cf4f" ${ln(2.2)}/>`,
  })}</g>`;
}
/* ---- ウサギさん（あおい リボン） ---- */
function rabbit(o = {}) {
  const droop = o.mood === "sad" || o.mood === "tired";
  const ear = (x, r) => `<g transform="rotate(${r} ${x} -200)"><ellipse cx="${x}" cy="-252" rx="19" ry="50" fill="${C.rb}" ${ln(2.8)}/><ellipse cx="${x}" cy="-248" rx="9" ry="36" fill="#ffc2cc"/></g>`;
  return `<g>${chibi({
    ...o, mood: o.mood || "happy", col: C.rb, belly: "#fffaf3",
    back: `<circle cx="-40" cy="-30" r="14" fill="#fff" ${ln(2.5)}/>`,
    ears: ear(-24, droop ? -40 : -10) + ear(24, droop ? 40 : 10),
    face: `<ellipse cx="0" cy="-130" rx="30" ry="20" fill="#fffaf3"/>`,
    nose: `<path d="M-5 -136 L5 -136 L0 -130 Z" fill="#f48a9c" stroke="#3a2a22" stroke-width="1.6"/>`,
    top: `<g transform="translate(34 -206)"><path d="M0 0 L-20 -12 L-20 12 Z M0 0 L20 -12 L20 12 Z" fill="#7fb6e8" ${ln(2.2)}/><circle cx="0" cy="0" r="6" fill="#7fb6e8" ${ln(2.2)}/></g>`,
  })}</g>`;
}
/* ---- キツネさん（みどりの ぼうし） ---- */
function fox(o = {}) {
  return `<g>${chibi({
    ...o, mood: o.mood || "sly", col: C.fx, belly: C.white, foot: "#6b4535",
    back: `<path d="M-22 -30 C-80 -24 -138 -60 -136 -116 C-116 -100 -88 -94 -70 -98 C-56 -76 -40 -64 -22 -62 Z" fill="${C.fx}" ${ln(2.8)}/>
           <path d="M-136 -116 C-128 -100 -112 -94 -96 -96 C-106 -110 -120 -116 -136 -116 Z" fill="${C.white}"/>`,
    ears: `<path d="M-56 -184 L-62 -240 L-20 -206 Z" fill="${C.fx}" ${ln(2.8)}/><path d="M56 -184 L62 -240 L20 -206 Z" fill="${C.fx}" ${ln(2.8)}/>
           <path d="M-52 -194 L-56 -226 L-30 -206 Z M52 -194 L56 -226 L30 -206 Z" fill="#6b4535"/>`,
    face: `<path d="M-64 -146 Q-34 -126 0 -132 Q34 -126 64 -146 Q56 -96 0 -92 Q-56 -96 -64 -146 Z" fill="${C.white}"/>`,
    top: o.noHat ? "" : `<path d="M-40 -204 Q-38 -240 0 -242 Q38 -240 40 -204 Z" fill="${C.hat}" ${ln(2.8)}/>
       <ellipse cx="0" cy="-204" rx="58" ry="12" fill="${C.hat}" ${ln(2.8)}/><path d="M14 -236 q12 -14 22 -4 q-10 2 -22 4 Z" fill="#a7d26a" ${ln(2)}/>`,
  })}</g>`;
}
/* ---- フクロウはかせ ---- */
function owl(o = {}) {
  const m = o.mood || "happy";
  const wingR = o.wingUp
    ? `<path d="M56 -130 C96 -150 112 -200 100 -224 C80 -206 64 -180 50 -162 Z" fill="${C.owlD}" ${ln(2.8)}/>`
    : `<path d="M60 -140 C90 -120 92 -70 72 -48 C64 -84 58 -110 54 -128 Z" fill="${C.owlD}" ${ln(2.8)}/>`;
  return `<g>
  <path d="M-24 -4 l-7 7 M-24 -4 l0 9 M-24 -4 l7 7 M24 -4 l-7 7 M24 -4 l0 9 M24 -4 l7 7" stroke="#e8a046" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="0" cy="-104" rx="76" ry="100" fill="${C.owl}" ${ln(2.8)}/>
  <ellipse cx="0" cy="-70" rx="46" ry="56" fill="${C.owlL}"/>
  <path d="M-26 -84 q7 7 14 0 q7 7 14 0 q7 7 14 0 M-32 -58 q7 7 14 0 q7 7 14 0 q7 7 14 0 q7 7 14 0" fill="none" stroke="${C.owlD}" stroke-width="2.5" opacity=".5"/>
  <path d="M-60 -140 C-90 -120 -92 -70 -72 -48 C-64 -84 -58 -110 -54 -128 Z" fill="${C.owlD}" ${ln(2.8)}/>
  ${wingR}
  <path d="M-56 -186 L-66 -222 L-30 -196 Z M56 -186 L66 -222 L30 -196 Z" fill="${C.owl}" ${ln(2.8)}/>
  <circle cx="-28" cy="-150" r="27" fill="#fff8ea"/><circle cx="28" cy="-150" r="27" fill="#fff8ea"/>
  ${eyes(-28, 28, -150, m, 12)}
  <circle cx="-28" cy="-150" r="24" fill="none" stroke="#4a4a52" stroke-width="3.5"/><circle cx="28" cy="-150" r="24" fill="none" stroke="#4a4a52" stroke-width="3.5"/>
  <path d="M-4 -150 L4 -150" stroke="#4a4a52" stroke-width="3.5"/>
  ${cheeks(-50, 50, -122, 10)}
  <path d="M-8 -128 L8 -128 L0 -114 Z" fill="#f0a640" stroke="#3a2a22" stroke-width="2"/>
  <path d="M-14 -96 L0 -89 L14 -96 L14 -82 L0 -89 L-14 -82 Z" fill="${C.red}" ${ln(2)}/>
  <path d="M-46 -206 L0 -224 L46 -206 L0 -190 Z" fill="#4a4c58" ${ln(2.8)}/><rect x="-20" y="-206" width="40" height="12" fill="#4a4c58"/>
  <path d="M0 -208 L36 -200 L38 -178" fill="none" stroke="#f2c14e" stroke-width="3"/><circle cx="38" cy="-176" r="5" fill="#f2c14e"/>
  ${holding(o.hold, -82)}
  ${o.wingHold ? `<g transform="translate(104 -232)">${o.wingHold}</g>` : ""}
  </g>`;
}
/* ---- ことりさん（まんまる） ---- */
function bird(o = {}) {
  const wing = o.wingDown
    ? `<path d="M-8 -2 C-30 12 -36 34 -20 40 C-8 28 4 12 4 0 Z" fill="${C.birdD}" ${ln(2.4)}/>`
    : `<path d="M-8 -8 C-30 -36 -28 -66 -10 -72 C0 -52 8 -30 6 -10 Z" fill="${C.birdD}" ${ln(2.4)}/>`;
  return `<g>
  <path d="M-30 6 L-50 -4 L-48 16 Z" fill="${C.birdD}" ${ln(2.4)}/>

/* ===== シーザー暗号（五十音を3つずらす） ===== */
const KANA = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
const PLAIN = "ひみつきちは きのした";
const KEY = 3;
const shift = (s, n) => [...s].map(c => {
  const i = KANA.indexOf(c);
  return i < 0 ? c : KANA[(i + n + KANA.length * 10) % KANA.length];
}).join("");
const CIPHER = shift(PLAIN, KEY);

/* ===== 解説（保護者・先生向け） ===== */

<h2>【解説】この絵本で紹介した暗号の仕組み</h2>

<tr><td>こっそり よんで もどす</td><td>盗聴（途中で読まれても、受け取った側は気づけない）</td></tr>
<tr><td>ひみつきちが ばれる</td><td>情報漏えい（機密性が失われる）</td></tr>

<tr><td>はこは だれでも しめられる</td><td>公開鍵は誰でも使えるので、暗号化だけでは送信者を確かめられない</td></tr>

<tr><td>いいとこどり</td><td>ハイブリッド暗号方式（共通鍵を公開鍵暗号で送る）</td></tr>

<h3>● シーザー暗号（換字式暗号）</h3>
<p>文字を決まった数だけずらして置き換える、最も古い暗号の一つです。ずらす数（鍵）の候補が少ないため、すべて試せばすぐに解読されてしまいます。暗号の強さは「鍵の候補の多さ」に大きく左右されます。</p>

<h3>● 共通鍵暗号方式</h3>
<p>送信者と受信者が同じ鍵を使います。処理が速いのが長所ですが、鍵そのものを相手に安全に届ける方法が問題になります（鍵配送問題）。また、通信相手ごとに別の鍵が必要になります。</p>

<h3>● 公開鍵暗号方式</h3>
<p>暗号化用の「公開鍵」と、復号用の「秘密鍵」をペアで使います。公開鍵は誰に知られても問題ないため、鍵配送問題を解決できます。一方で、共通鍵暗号に比べて処理に時間がかかります。</p>

<h3>● デジタル署名</h3>
<p>送信者が自分の秘密鍵で署名を付け、受信者は送信者の公開鍵で検証します。これにより「本人が送ったこと（なりすましでないこと）」と「途中で書き換えられていないこと（改ざんされていないこと）」を確かめられます。暗号化のときとは鍵の使い方が逆になる点に注目です。絵本では「はんこ」が秘密鍵、「ルーペ」が公開鍵にあたります。</p>

<h3>● ハイブリッド暗号方式</h3>
<p>やりとりに使う共通鍵だけを公開鍵暗号で安全に届け、その後の大量のデータは高速な共通鍵暗号でやりとりします。Webサイトの通信を守る SSL/TLS（URLが https で始まるもの）は、この仕組みとデジタル署名を組み合わせて使っています。</p>

<p style="margin-top:16px;">子どもたちが将来、安全にインターネットを使えるようになるための第一歩として、この物語が「情報の守り方」を考えるきっかけになれば幸いです。</p>
`;

             <div class="col right">${p.right || ""}</div></div>`;

/* シーザー体験の動き */
let back = 0;
function drawCaesar() {
  const msg = document.getElementById("cMsg");
  msg.textContent = shift(CIPHER, -back);
  msg.classList.toggle("ok", back === KEY);
  document.getElementById("cNum").textContent = `${back}つ もどす`;
  document.getElementById("cHint").textContent =
    back === KEY ? "よめた！「ひみつきちは きのした」だね。" : back === 0 ? "－ と ＋ で ずらしてみよう" : "";
}
document.getElementById("cMinus").onclick = () => { back = (back + KANA.length - 1) % KANA.length; drawCaesar(); };
document.getElementById("cPlus").onclick  = () => { back = (back + 1) % KANA.length; drawCaesar(); };
drawCaesar();

/* ===== ページめくり ===== */
let cur = 0;
const total = PAGES.length;
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const restartBtn = document.getElementById("restart");

function show(n) {
  document.getElementById("spread-" + cur).classList.remove("active");
  cur = n;
  document.getElementById("spread-" + cur).classList.add("active");
  prevBtn.setAttribute("aria-disabled", cur === 0);
  nextBtn.setAttribute("aria-disabled", cur === total - 1);
  restartBtn.style.visibility = cur === total - 1 ? "visible" : "hidden";
  document.getElementById("pageNo").textContent = `${cur + 1} / ${total}`;
}
function go(dir) { const n = cur + dir; if (n >= 0 && n < total) show(n); }
prevBtn.onclick = () => go(-1);
nextBtn.onclick = () => go(1);
restartBtn.onclick = () => { back = 0; drawCaesar(); show(0); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
show(0);
